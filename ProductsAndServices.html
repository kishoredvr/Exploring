<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop Products | Ganesh Solutions</title>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif; }
        :root {
            --primary-blue:#1a365d; --accent-gold:#d4af37; --dark-navy:#0f1a3c;
            --light-gray:#f5f7fa; --medium-gray:#e2e8f0; --text-dark:#2d3748; --text-light:#718096;
        }
        body { background:var(--light-gray); color:var(--text-dark); line-height:1.6; min-height:100vh; scroll-padding-top:140px; }
        a { color:inherit; text-decoration: none; }
        
        /* Reduced left/right margins by expanding max-width to 96% */
        .container { max-width:96%; margin:0 auto; padding:0 20px; width:100%; }
        *:focus-visible { outline:2px solid var(--accent-gold); outline-offset:2px; }
        @media (prefers-reduced-motion:reduce){ *{ animation-duration:.001ms!important; transition-duration:.001ms!important; } }

        #header-placeholder { min-height: 100px; }
        #footer-placeholder { min-height: 300px; }

        header { background:linear-gradient(135deg,var(--dark-navy) 0%,var(--primary-blue) 100%); color:white; padding:15px 0; box-shadow:0 2px 10px rgba(0,0,0,.1); position:sticky; top:0; z-index:1000; }
        .mobile-header { display:none; padding:15px 0; background:linear-gradient(135deg,var(--dark-navy) 0%,var(--primary-blue) 100%); color:white; align-items:center; justify-content:space-between; width:100%; position:sticky; top:0; z-index:1000; box-shadow:0 2px 10px rgba(0,0,0,.1); }
        .header-content { display:flex; justify-content:space-between; align-items:center; gap:10px; }
        .logo { display:flex; align-items:center; gap:12px; flex-shrink:0; }
        .logo-image { height:70px; width:auto; margin-top:5px; border-radius:50%; object-fit:cover; }
        .logo-text-container { display:flex; flex-direction:column; white-space:nowrap; }
        .logo-text { font-size:24px; font-weight:600; color:white; }
        .tagline { font-size:14px; color:rgba(255,255,255,.7); }
        
        nav ul { display:flex; list-style:none; align-items:center; }
        nav ul li { margin-left:30px; position:relative; }
        nav ul li a { color:white; text-decoration:none; font-weight:500; padding:8px 15px; border-radius:4px; transition:all .3s; display:flex; align-items:center; white-space:nowrap; }
        nav ul li a:hover, nav ul li a.active { background:rgba(255,255,255,.1); color:var(--accent-gold); }
        
        .dropdown-menu { position:absolute; top:100%; left:0; background:white; min-width:220px; box-shadow:0 8px 16px rgba(0,0,0,.1); border-radius:4px; opacity:0; visibility:hidden; transform:translateY(-10px); transition:all .3s ease; z-index:1000; }
        nav ul li:hover .dropdown-menu { opacity:1; visibility:visible; transform:translateY(0); }
        .dropdown-menu.flip-left { left: auto; right: 0; }
        .dropdown-menu a { color:var(--text-dark)!important; padding:12px 20px; display:flex; align-items:center; border-bottom:1px solid var(--medium-gray); white-space:nowrap; }
        .dropdown-menu a:hover { background:var(--light-gray); color:var(--primary-blue)!important; }
        .dropdown-menu i { margin-right:10px; width:20px; text-align:center; }
        .mobile-menu-toggle { background:none; border:none; font-size:24px; color:white; cursor:pointer; width:44px; height:44px; display:flex; align-items:center; justify-content:center; }

        .shop-toolbar { background:var(--primary-blue); z-index:900; box-shadow:0 3px 8px rgba(0,0,0,.08); position:relative; }
        .shop-toolbar-inner { display:flex; align-items:center; gap:16px; padding:12px 0; }
        .search-box { flex:1; display:flex; align-items:center; background:white; border-radius:6px; overflow:hidden; max-width:640px; }
        .search-box i { padding:0 12px; color:var(--text-light); }
        .search-box input { flex:1; border:none; outline:none; padding:11px 8px 11px 0; font-size:14px; }
        .toolbar-actions { display:flex; align-items:center; gap:10px; margin-left:auto; }
        .icon-btn { position:relative; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2); color:white; width:42px; height:42px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; transition:.2s; }
        .icon-btn:hover { background:rgba(255,255,255,.18); border-color:var(--accent-gold); }
        .icon-badge { position:absolute; top:-6px; right:-6px; background:var(--accent-gold); color:var(--dark-navy); font-size:10px; font-weight:800; width:19px; height:19px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

        .shop-hero { background:linear-gradient(135deg,rgba(15,26,60,.93) 0%,rgba(26,54,93,.93) 100%), url('https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=1400&q=80'); background-size:cover; background-position:center; color:white; padding:34px 0; text-align:center; }
        .shop-hero h1 { font-size:clamp(22px,3.4vw,32px); font-weight:600; margin-bottom:6px; }
        .shop-hero p { font-size:14px; color:rgba(255,255,255,.78); }

        .shop-body { padding:26px 0 60px; }
        /* 2-Column layout: Products | Cart */
        .shop-layout { display:grid; grid-template-columns:1fr 350px; gap:30px; align-items:start; }

        .results-toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; flex-wrap:wrap; gap:10px; }
        .results-count { font-size:14px; color:var(--text-light); }
        .results-count strong { color:var(--primary-blue); }
        .filter-option { display:flex; align-items:center; gap:6px; font-size:13.5px; color:var(--text-dark); cursor:pointer; margin:0; }
        .filter-option input { accent-color:var(--accent-gold); width:15px; height:15px; }
        .sort-select { padding:9px 14px; border:1.5px solid var(--medium-gray); border-radius:6px; font-size:13px; background:white; color:var(--text-dark); cursor:pointer; }

        .product-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:18px; }
        .product-card { background:white; border-radius:8px; border:1px solid var(--medium-gray); overflow:hidden; transition:transform .25s,box-shadow .25s; display:flex; flex-direction:column; position:relative; }
        .product-card:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,0,0,.10); }
        .card-media { position:relative; aspect-ratio:3/4; background:#eef2f6; overflow:hidden; cursor:pointer; }
        .card-media img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .4s; }
        .product-card:hover .card-media img { transform:scale(1.05); }
        .card-media .placeholder-fill { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; background:linear-gradient(145deg,#e2e8f0,#cbd5e1); color:var(--text-light); font-size:13px; }
        .card-media .placeholder-fill i { font-size:38px; color:var(--primary-blue); opacity:.6; }
        .stock-badge { position:absolute; top:10px; left:10px; font-size:9px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:20px; background:var(--accent-gold); color:var(--dark-navy); }
        .stock-badge.soon { background:rgba(15,26,60,.75); color:white; }
        
        .card-action-btn { width:100%; padding:10px; border-radius:6px; border:none; background:var(--accent-gold); color:var(--dark-navy); font-size:13px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; margin-top:14px; transition:.2s; }
        .card-action-btn:hover { opacity:0.9; }
        .card-action-btn.in-cart { background:var(--dark-navy); color:white; }
        .card-info { padding:13px 14px 15px; flex:1; display:flex; flex-direction:column; }
        .card-category { font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--text-light); margin-bottom:4px; }
        .card-title { font-size:14px; font-weight:600; color:var(--text-dark); line-height:1.35; margin-bottom:6px; cursor:pointer; }
        .card-title:hover { color:var(--primary-blue); }
        .card-price-row { display:flex; align-items:baseline; gap:6px; margin-top:auto; padding-top:6px; }
        .card-price { font-size:17px; font-weight:700; color:var(--primary-blue); }
        .card-price-label { font-size:11px; color:var(--text-light); }
        .card-price.tba { color:var(--text-light); font-size:14px; }

        .empty-state { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-light); }
        .empty-state i { font-size:40px; margin-bottom:14px; display:block; color:#cbd5e0; }
        .loading-spinner { grid-column:1/-1; text-align:center; padding:60px; color:var(--primary-blue); font-size:16px; }

        .detail-view-container { animation:fadeIn .3s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }
        
        .btn-back { display:inline-flex; align-items:center; gap:8px; padding:8px 16px; background:white; color:var(--primary-blue); border:1px solid var(--medium-gray); border-radius:6px; font-weight:600; font-size:14px; cursor:pointer; transition:0.2s; margin-bottom:16px; text-decoration:none; }
        .btn-back:hover { background:var(--light-gray); border-color:var(--text-light); color:var(--dark-navy); }

        .breadcrumb { font-size:13px; color:var(--text-light); margin-bottom:16px; }
        .breadcrumb a { color:var(--primary-blue); text-decoration:none; font-weight:600; cursor:pointer; }
        .breadcrumb a:hover { text-decoration:underline; }
        .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:36px; background:white; border-radius:12px; border:1px solid var(--medium-gray); padding:30px; box-shadow:0 8px 24px rgba(0,0,0,.06); }
        .detail-media { position:relative; }
        .detail-carousel-slide { aspect-ratio:1/1; background:#eef2f6; display:flex; align-items:center; justify-content:center; border-radius:8px; overflow:hidden; }
        .detail-carousel-slide img { width:100%; height:100%; object-fit:contain; }
        .carousel-slides { display:flex; transition:transform .4s ease-in-out; }
        .carousel-slide-item { flex:0 0 100%; }
        .carousel-btn { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.55); color:white; border:none; width:34px; height:34px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; z-index:2; }
        .carousel-btn:hover { background:var(--accent-gold); color:var(--dark-navy); }
        .carousel-prev { left:10px; } .carousel-next { right:10px; }
        .carousel-dots { display:flex; justify-content:center; gap:8px; margin-top:12px; }
        .dot { width:8px; height:8px; background:#cbd5e0; border-radius:50%; cursor:pointer; transition:.2s; }
        .dot.active { background:var(--accent-gold); width:20px; border-radius:12px; }
        .detail-badge { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:20px; background:var(--accent-gold); color:var(--dark-navy); margin-bottom:12px; }
        .detail-title { font-size:26px; color:var(--dark-navy); line-height:1.25; margin-bottom:12px; }
        .detail-price { font-size:30px; font-weight:700; color:var(--primary-blue); margin-bottom:20px; display:flex; align-items:baseline; gap:8px; }
        .detail-overview { background:var(--light-gray); padding:18px; border-radius:8px; border:1px solid var(--medium-gray); margin-bottom:22px; font-size:14px; color:var(--text-dark); }
        .detail-features-list { list-style:none; margin-bottom:26px; }
        .detail-features-list li { margin-bottom:10px; display:flex; align-items:flex-start; gap:9px; font-size:14px; color:var(--text-dark); }
        .detail-features-list i { color:var(--accent-gold); margin-top:2px; }
        .detail-actions { display:flex; gap:12px; }

        /* Form elements for Custom Apps Enquiries */
        .enquiry-card { background: white; border-radius: 8px; border: 1.5px solid var(--accent-gold); overflow: hidden; margin-top: 24px; }
        .enquiry-header { background: #f9fafb; padding: 14px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--accent-gold); }
        .enquiry-header-text h3 { font-size: 16px; font-weight: 700; color: var(--primary-blue); margin: 0; }
        .enquiry-header-text p { font-size: 12px; color: var(--text-light); margin: 2px 0 0; }
        .enquiry-body { padding: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        .form-group label { font-size: 13px; font-weight: 600; color: var(--text-dark); }
        .form-group input, .form-group textarea { padding: 10px; border: 1.5px solid var(--medium-gray); border-radius: 6px; font-size: 13px; transition: 0.2s; width: 100%; font-family: inherit; }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-gold); outline: none; }
        .form-full { grid-column: 1 / -1; }
        .form-success { display: none; text-align: center; padding: 24px; background: #f0fdf4; color: #166534; font-size: 14px; }
        .btn-submit { width:100%; justify-content:center; background: var(--primary-blue); color: white; padding: 12px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: .2s; }
        .btn-submit:hover { background: var(--dark-navy); }

        .cart-sidebar { position: sticky; top: 20px; }
        .cart-panel { background: white; border-radius: 10px; border: 1px solid var(--medium-gray); box-shadow: 0 6px 24px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 40px); }
        .cart-header { background: linear-gradient(135deg, var(--dark-navy) 0%, var(--primary-blue) 100%); padding: 16px 20px; display: flex; align-items: center; gap: 10px; }
        .cart-header-text { flex: 1; color: white; }
        .cart-header-text h3 { font-size: 16px; font-weight: 600; margin:0; }
        .cart-header-text p { font-size: 11px; color: rgba(255, 255, 255, 0.65); margin:0; }
        .cart-count-badge { background: var(--accent-gold); color: var(--dark-navy); font-size: 12px; font-weight: 700; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .cart-empty { padding: 32px 20px; text-align: center; color: var(--text-light); }
        .cart-empty i { font-size: 2.2rem; color: #cbd5e0; display: block; margin-bottom: 10px; }
        
        /* Ensures cart items actually display when JS triggers it */
        .cart-items { padding: 0; overflow-y: auto; flex: 1; display:none; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--medium-gray); }
        .cart-item-icon { width: 40px; height: 40px; border-radius: 8px; background: linear-gradient(135deg, var(--dark-navy), var(--primary-blue)); display: flex; align-items: center; justify-content: center; font-size: 16px; color: var(--accent-gold); flex-shrink: 0; }
        .cart-item-info { flex: 1; display:flex; flex-direction:column; }
        .cart-item-name { font-size: 13.5px; font-weight: 600; color: var(--text-dark); line-height: 1.3; }
        .cart-item-price { font-size: 15px; font-weight: 700; color: var(--dark-navy); margin-top: 4px; }
        
        /* Prominent Remove Button inside cart items */
        .cart-item-remove { background: #fff5f5; border: 1px solid #fed7d7; border-radius: 4px; cursor: pointer; color: #e53e3e; padding: 6px 10px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; white-space: nowrap; flex-shrink: 0; }
        .cart-item-remove:hover { background: #fee2e2; color: #b91c1c; border-color:#fca5a5; }
        
        .cart-totals { padding: 14px 18px; border-bottom: 1px solid var(--medium-gray); display: none; }
        .total-row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 13px; }
        .total-row.grand { border-top: 2px solid var(--medium-gray); margin-top: 8px; padding-top: 10px; font-size: 16px; font-weight: 700; color: var(--primary-blue); }
        .total-row.grand span:last-child { color: var(--accent-gold); font-size: 18px; }
        
        .cart-pay-form { padding: 16px 18px; display: none; border-bottom: 1px solid var(--medium-gray); }
        .pay-form-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; }
        .pay-field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; }
        .pay-field input { padding: 9px 12px; border: 1.5px solid var(--medium-gray); border-radius: 5px; font-size: 13px; }
        
        .cart-actions { padding: 14px 18px; display: none; gap: 8px; flex-direction: column; }
        .btn-pay-now { background: var(--accent-gold); color: var(--dark-navy); border: none; border-radius: 5px; padding: 12px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.3s; }
        .btn-pay-now:disabled { opacity: 0.7; cursor: not-allowed; }
        .btn-clear-cart { background: transparent; border: 1px solid var(--medium-gray); border-radius: 5px; padding: 9px; cursor: pointer; width: 100%; transition: .2s; }
        .btn-clear-cart:hover { background: #f1f5f9; }
        .secure-note { padding: 0 18px 14px; font-size: 11px; color: var(--text-light); display: none; gap: 6px; align-items:center; }
        
        .cart-backdrop { position:fixed; inset:0; background:rgba(15,26,60,.55); z-index:3000; display:none; }
        .cart-backdrop.open { display:block; }
        .cart-header-close { display: none; background: rgba(255,255,255,.12); border: none; color: white; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; font-size: 15px; }

        .toast { position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--dark-navy); color:white; padding:12px 22px; border-radius:30px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:10px; z-index:4000; opacity:0; pointer-events:none; transition:.25s; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        .toast i { color:var(--accent-gold); }

        .lightbox-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:9000; align-items:center; justify-content:center; }
        .lightbox-overlay.open { display:flex; }
        #paymentModal { position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:rgba(15,26,60,.9); backdrop-filter:blur(4px); }
        #paymentModal.visible { display:flex; }
        .payment-modal-content { background:white; padding:40px 30px; border-radius:12px; max-width:320px; width:90%; text-align:center; box-shadow:0 20px 40px rgba(0,0,0,.2); }
        .payment-modal-content .spinner { width:30px; height:30px; border-radius:50%; border:3px solid rgba(0,0,0,.1); border-top:3px solid var(--accent-gold); animation:spin 1s linear infinite; margin:0 auto 15px; }
        @keyframes spin { 100%{transform:rotate(360deg);} }
        .payment-modal-content h3 { font-size:18px; color:var(--dark-navy); margin-bottom:5px; font-weight:bold; }
        .payment-modal-content p { font-size:13px; color:var(--text-light); }

        footer { background:var(--dark-navy); color:white; padding:50px 0 20px; }
        .footer-content { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:30px; margin-bottom:30px; }
        .footer-column h3 { font-size:20px; margin-bottom:20px; color:var(--accent-gold); }
        .footer-column ul { list-style:none; }
        .footer-column ul li { margin-bottom:10px; }
        .footer-column a { color:rgba(255,255,255,.7); text-decoration:none; transition:color .3s; word-wrap:break-word; }
        .footer-column a:hover { color:var(--accent-gold); }
        .copyright { text-align:center; padding-top:20px; border-top:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.5); font-size:14px; }

        @media (max-width:992px) {
            header { height:0!important; min-height:0!important; padding:0!important; overflow:hidden; }
            .mobile-header { display:flex; }
            nav#mainNav { display:none; position:fixed; top:70px; left:0; width:100%; height:calc(100% - 70px); background:var(--dark-navy); z-index:2000; padding:20px; overflow-y:auto; transform:translateX(-100%); transition:transform .3s ease; }
            nav#mainNav.active { display:block; transform:translateX(0); }
            nav ul { flex-direction:column; align-items:flex-start; margin-top:30px; width:100%; }
            nav ul li { margin:10px 0; width:100%; border-bottom:1px solid rgba(255,255,255,.1); }
            nav ul li a { padding:15px 0; width:100%; }
            .dropdown-menu { position:static; opacity:1; visibility:visible; transform:none; background:rgba(255,255,255,.05); display:none; width:100%; margin-top:10px; max-height:0; overflow:hidden; transition:max-height .3s ease; left:0!important; right:auto!important; }
            nav ul li.active .dropdown-menu { display:block; max-height:1000px; }
            
            /* Responsive Cart Slide-out */
            .shop-layout { grid-template-columns: 1fr; }
            .cart-sidebar { 
                position: fixed; top: 0; right: 0; width: 400px; max-width: 92vw; height: 100%; 
                z-index: 3001; transform: translateX(100%); transition: transform 0.3s ease; 
            }
            .cart-sidebar.open { transform: translateX(0); }
            .cart-panel { border-radius: 0; border: none; box-shadow: -8px 0 24px rgba(0,0,0,0.15); max-height: 100vh; }
            .cart-header-close { display: block; }
            
            .detail-grid { grid-template-columns:1fr; padding:20px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="shop-toolbar">
        <div class="container shop-toolbar-inner">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search products..." oninput="applyFilters()">
            </div>
            <div class="toolbar-actions">
                <button class="icon-btn" onclick="openCartDrawer()" aria-label="Cart" title="View Cart">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="icon-badge" id="cartBadge" style="display:none;">0</span>
                </button>
            </div>
        </div>
    </div>



    <section class="shop-body" id="products">
        <div class="container">
            <div class="shop-layout">

                <!-- MAIN PRODUCTS GRID -->
                <div>
                    <div class="results-toolbar">
                        <div class="results-count"><strong id="resultsCount">0</strong> products found</div>
                        <div style="display:flex; align-items:center; gap:18px;">
                            <label class="filter-option"><input type="checkbox" id="filterLiveOnly" onchange="applyFilters()"> In stock only</label>
                            <select class="sort-select" id="sortSelect" onchange="applyFilters()">
                                <option value="default">Sort: Featured</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                                <option value="name-asc">Name: A to Z</option>
                            </select>
                        </div>
                    </div>

                    <div class="product-grid" id="productsListView">
                        <div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i> Loading products...</div>
                    </div>

                    <div id="productDetailView" style="display:none;"></div>
                </div>

                <div class="cart-backdrop" id="cartBackdrop" onclick="closeCartDrawer()"></div>
                <div class="cart-sidebar" id="cartSidebar">
                    <div class="cart-panel">
                        <div class="cart-header">
                            <i class="fas fa-shopping-cart" style="color:var(--accent-gold);font-size:18px;"></i>
                            <div class="cart-header-text">
                                <h3>Your Cart</h3>
                                <p>Selected products</p>
                            </div>
                            <div class="cart-count-badge" id="cartCountBadge">0</div>
                            <button class="cart-header-close" onclick="closeCartDrawer()" aria-label="Close cart"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="cart-empty" id="cartEmpty">
                            <i class="fas fa-cart-plus"></i>
                            <p>Your cart is empty.<br>Browse products and add something you like.</p>
                        </div>
                        
                        <!-- Explicit Cart Items Container -->
                        <div class="cart-items" id="cartItems"></div>
                        
                        <div class="cart-totals" id="cartTotals">
                            <div class="total-row"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
                            <div class="total-row"><span>GST (18%)</span><span id="cartGst">₹0</span></div>
                            <div class="total-row grand"><span>Total Payable</span><span id="cartGrand">₹0</span></div>
                        </div>
                        
                        <div class="cart-pay-form" id="cartPayForm">
                            <p class="pay-form-title"><i class="fas fa-user"></i> Your Details</p>
                            <div class="pay-field"><label style="font-size:12px;font-weight:600;">Full Name *</label><input type="text" id="pay-name" placeholder="e.g. Rajesh Kumar"></div>
                            <div class="pay-field"><label style="font-size:12px;font-weight:600;">Mobile / WhatsApp *</label><input type="tel" id="pay-phone" placeholder="+91 XXXXX XXXXX"></div>
                            <div class="pay-field"><label style="font-size:12px;font-weight:600;">Email Address</label><input type="email" id="pay-email" placeholder="you@example.com"></div>
                        </div>
                        
                        <div class="cart-actions" id="cartActions">
                            <button class="btn-pay-now" onclick="proceedToPayment()"><i class="fas fa-lock"></i> Checkout & Pay</button>
                            <button class="btn-clear-cart" onclick="clearCart()"><i class="fas fa-trash-alt"></i> Clear Cart</button>
                        </div>
                        
                        <div class="secure-note" id="secureNote">
                            <i class="fas fa-shield-alt" style="color:var(--accent-gold);"></i> Secure checkout · SSL encrypted
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastMsg"></span></div>

    <div class="lightbox-overlay" id="customAlertModal" style="z-index:99999;">
        <div style="background:white;padding:30px;border-radius:12px;max-width:400px;width:90%;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2);">
            <i class="fas fa-exclamation-circle" style="font-size:40px;color:var(--accent-gold);margin-bottom:15px;"></i>
            <p id="customAlertMessage" style="font-size:16px;color:var(--dark-navy);margin-bottom:20px;"></p>
            <button onclick="document.getElementById('customAlertModal').classList.remove('open')" style="background:var(--primary-blue);color:white;border:none;padding:10px 24px;border-radius:6px;cursor:pointer;font-weight:600;">OK</button>
        </div>
    </div>

    <div id="paymentModal">
        <div class="payment-modal-content">
            <div class="spinner"></div>
            <h3>Redirecting to Razorpay</h3>
            <p>Please wait while we secure your payment.</p>
        </div>
    </div>

    <script>
        const BACKEND_BASE = 'https://lkvcbpxkpwpoqjlcddgl.functions.supabase.co';
        const RAZORPAY_KEY_ID = 'rzp_live_SG5xWhtRJUaBRL';
        const SUPABASE_ANON_KEY = '__SUPABASE_ANON_KEY__';

        let allProductsData = [];
        let filteredProducts = [];
        let cart = {};
        let slideIndex = {};
        let slideCount = {};

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            t.classList.add('show');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }
        function showCustomAlert(message) {
            document.getElementById('customAlertMessage').textContent = message;
            document.getElementById('customAlertModal').classList.add('open');
        }
        function iconFor(prod) {
            let iconClass = 'fa-box';
            if (prod.icon) { const m = prod.icon.match(/fa-[a-zA-Z0-9-]+/g); if (m) iconClass = m[0]; }
            return iconClass;
        }

        document.addEventListener('DOMContentLoaded', function () {
            loadProductsFromCSV();
        });

        async function loadMasterCopy() {
            try {
                const response = await fetch('Components.html');
                if (!response.ok) throw new Error('Components.html not found');
                
                const text = await response.text();
                const parser = new DOMParser();
                const masterDoc = parser.parseFromString(text, 'text/html');

                const headerContent = masterDoc.getElementById('site-header-source');
                if (headerContent) {
                    document.getElementById('header-placeholder').innerHTML = headerContent.innerHTML;
                }

                const footerContent = masterDoc.getElementById('site-footer-source');
                if (footerContent) {
                    document.getElementById('footer-placeholder').innerHTML = footerContent.innerHTML;
                }

                initMenuLogic();
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        function initMenuLogic() {
            const mobileBtn = document.getElementById('mobileMenuToggle');
            const mainNav   = document.getElementById('mainNav');
            const dropdowns = document.querySelectorAll('.dropdown-toggle');

            if (mobileBtn && mainNav) {
                mobileBtn.onclick = function () {
                    const isActive = mainNav.classList.toggle('active');
                    this.innerHTML = isActive ? '<i class="fas fa-times"></i>' : '<i class="fas fa-bars"></i>';
                    document.body.style.overflow = isActive ? 'hidden' : '';
                };
            }

            dropdowns.forEach(function (toggle) {
                toggle.addEventListener('click', function (e) {
                    if (window.innerWidth <= 992) {
                        e.preventDefault();
                        const li = toggle.parentElement;
                        document.querySelectorAll('nav li').forEach(function (item) {
                            if (item !== li) item.classList.remove('active');
                        });
                        li.classList.toggle('active');
                    }
                });
            });

            document.querySelectorAll('nav a').forEach(function (link) {
                link.addEventListener('click', function () {
                    if (window.innerWidth <= 992 && !this.classList.contains('dropdown-toggle')) {
                        if (mainNav) mainNav.classList.remove('active');
                        if (mobileBtn) mobileBtn.innerHTML = '<i class="fas fa-bars"></i>';
                        document.body.style.overflow = '';
                    }
                });
            });

            function repositionDropdowns() {
                if (window.innerWidth <= 992) return;
                document.querySelectorAll('nav ul li').forEach(function (li) {
                    var menu = li.querySelector('.dropdown-menu');
                    if (!menu) return;
                    menu.classList.remove('flip-left');
                    menu.style.left  = '';
                    menu.style.right = '';
                    var prevVis = menu.style.visibility;
                    var prevDis = menu.style.display;
                    menu.style.visibility = 'hidden';
                    menu.style.display    = 'block';
                    var rect = menu.getBoundingClientRect();
                    var vw   = window.innerWidth || document.documentElement.clientWidth;
                    menu.style.visibility = prevVis;
                    menu.style.display    = prevDis;
                    if (rect.right > vw) {
                        menu.classList.add('flip-left');
                    } else if (rect.left < 0) {
                        menu.style.left  = '0';
                        menu.style.right = 'auto';
                    }
                });
            }

            repositionDropdowns();
            window.addEventListener('resize', repositionDropdowns);
        }

        window.onload = loadMasterCopy;

        async function loadProductsFromCSV() {
            try {
                const response = await fetch(BACKEND_BASE + '/get-products-csv', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                if (!response.ok) {
                    let errMsg = `Failed to fetch product data (Status: ${response.status})`;
                    try { const errJson = await response.json(); if (errJson.error) errMsg = `Backend Error: ${errJson.error}`; } catch (e) {}
                    throw new Error(errMsg);
                }
                const csvText = await response.text();
                const rows = csvText.split('\n').map(row => {
                    const regex = /,(?=(?:(?:[^"]*"){2})*[^"]*$)/;
                    return row.split(regex).map(item => item.replace(/^"|"$/g, '').trim());
                }).filter(row => row.length > 1);

                const headers = rows.shift();
                const products = rows.map(row => {
                    let obj = {};
                    headers.forEach((h, i) => { obj[h] = row[i] || ''; });
                    return obj;
                });

                // Top Priority custom app injected here
                const customAppObj = {
                    id: 'custom-app',
                    title: 'Custom Application Development',
                    category: 'Service',
                    isCustomApp: true,
                    isLive: 'TRUE',
                    priceLabel: 'Tailored to your needs',
                    shortDesc: 'Have a unique business idea? We design and build tailor-made software solutions around your exact workflow — no compromise, no features you will never use.',
                    features: 'Desktop Applications (Billing, ERP, Payroll)|Web Applications (Dashboards, Portals)|Mobile Apps (Android for field teams)|Inventory & ERP Systems|Custom Integrations & APIs',
                    images: 'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?ixlib=rb-4.0.3&auto=format&fit=crop&w=1200&q=80',
                    icon: 'fa-laptop-code'
                };

                allProductsData = [customAppObj, ...products];
                applyFilters();
                handleHashRouting();
            } catch (e) {
                console.error(e);
                document.getElementById('productsListView').innerHTML = `
                    <div class="empty-state" style="color:#e53e3e;">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3 style="font-size:16px;margin-bottom:5px;">Error loading products</h3>
                        <p style="font-size:13px;">${e.message}</p>
                    </div>`;
            }
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.trim().toLowerCase();
            const liveOnly = document.getElementById('filterLiveOnly').checked;
            const sort = document.getElementById('sortSelect').value;

            let list = allProductsData.filter(p => {
                const isLive = String(p.isLive).toUpperCase() === 'TRUE';
                if (liveOnly && !isLive) return false;
                if (search) {
                    const hay = `${p.title||''} ${p.category||''} ${p.shortDesc||''}`.toLowerCase();
                    if (!hay.includes(search)) return false;
                }
                return true;
            });

            list.sort((a, b) => {
                if (a.isCustomApp) return -1; // Ensure custom app stays top priority
                if (b.isCustomApp) return 1;
                
                if (sort === 'price-asc') return (parseFloat(a.price)||0) - (parseFloat(b.price)||0);
                if (sort === 'price-desc') return (parseFloat(b.price)||0) - (parseFloat(a.price)||0);
                if (sort === 'name-asc') return (a.title||'').localeCompare(b.title||'');
                return 0; // default order
            });

            filteredProducts = list;
            document.getElementById('resultsCount').textContent = list.length;
            renderDynamicProducts(list);
        }

        function renderDynamicProducts(products) {
            const grid = document.getElementById('productsListView');
            if (!products.length) {
                grid.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><h3 style="font-size:16px;margin-bottom:6px;color:var(--text-dark);">No products found</h3><p>Try adjusting your search or filters.</p></div>`;
                return;
            }
            grid.innerHTML = '';
            products.forEach(prod => {
                const isLive = String(prod.isLive).toUpperCase() === 'TRUE';
                const price = parseFloat(prod.price) || 0;
                const images = prod.images ? prod.images.split('|').map(s => s.trim()).filter(Boolean) : [];
                const mainImg = images[0] || '';
                const inCart = !!cart[prod.id];

                const mediaHTML = mainImg
                    ? `<img src="${mainImg}" alt="${prod.title||'Product'}">`
                    : `<div class="placeholder-fill"><i class="fas ${prod.placeholderIcon || 'fa-image'}"></i><span>${prod.placeholderText || 'Coming Soon'}</span></div>`;

                const badgeHTML = isLive ? '' : `<span class="stock-badge soon">Coming Soon</span>`;
                
                let priceHTML = '';
                if (prod.isCustomApp) {
                    priceHTML = `<span class="card-price" style="font-size:16px;">Custom Quote</span>`;
                } else {
                    priceHTML = isLive
                        ? `<span class="card-price">₹${price.toLocaleString('en-IN')}</span>${prod.priceLabel ? `<span class="card-price-label">${prod.priceLabel}</span>` : ''}`
                        : `<span class="card-price tba">TBA</span>`;
                }

                let actionBtnHTML = '';
                if (prod.isCustomApp) {
                    actionBtnHTML = `<button class="card-action-btn" onclick="event.stopPropagation();window.location.hash='#product-${prod.id}'"><i class="fas fa-arrow-right"></i> View Details</button>`;
                } else {
                    actionBtnHTML = isLive
                        ? `<button class="card-action-btn ${inCart ? 'in-cart' : ''}" onclick="event.stopPropagation();toggleCartState('${prod.id}')"><i class="fas ${inCart ? 'fa-check' : 'fa-cart-plus'}"></i> ${inCart ? 'In Cart' : 'Add to Cart'}</button>`
                        : `<button class="card-action-btn" disabled style="opacity:.6;cursor:not-allowed;"><i class="fas fa-clock"></i> Notify Me</button>`;
                }

                grid.insertAdjacentHTML('beforeend', `
                    <div class="product-card" id="card-${prod.id}">
                        <div class="card-media" onclick="window.location.hash='#product-${prod.id}'">
                            ${mediaHTML}
                            ${badgeHTML}
                        </div>
                        <div class="card-info" onclick="window.location.hash='#product-${prod.id}'" style="cursor:pointer;">
                            <p class="card-category">${prod.category || 'Product'}</p>
                            <p class="card-title">${prod.title || 'Untitled'}</p>
                            <div class="card-price-row">${priceHTML}</div>
                            ${actionBtnHTML}
                        </div>
                    </div>
                `);
            });
        }

        window.addEventListener('hashchange', handleHashRouting);
        function handleHashRouting() {
            const hash = window.location.hash;
            if (hash.startsWith('#product-') && allProductsData.length) {
                renderDetailView(hash.replace('#product-', ''));
            } else {
                document.getElementById('productDetailView').style.display = 'none';
                document.getElementById('productDetailView').innerHTML = '';
                document.querySelector('.results-toolbar').style.display = '';
                document.getElementById('productsListView').style.display = '';
            }
        }

        function renderDetailView(id) {
            const prod = allProductsData.find(p => p.id === id);
            if (!prod) { window.location.hash = ''; return; }

            const isLive = String(prod.isLive).toUpperCase() === 'TRUE';
            const price = parseFloat(prod.price) || 0;
            const features = prod.features ? prod.features.split(/[|\n,]/).map(s => s.trim()).filter(Boolean) : [];
            const images = prod.images ? prod.images.split('|').map(s => s.trim()).filter(Boolean) : [];
            const rawImages = images.map(src => {
                if (src.includes('wsrv.nl')) {
                    try { const u = new URL(src); const raw = u.searchParams.get('url'); if (raw) return raw; } catch (e) {}
                }
                return src;
            });

            let mediaHTML = '';
            if (isLive && rawImages.length > 0) {
                const slidesHTML = rawImages.map(src => `<div class="carousel-slide-item"><div class="detail-carousel-slide"><img src="${src}" alt="${prod.title||'Product'} screenshot"></div></div>`).join('');
                const dotsHTML = rawImages.map((_, idx) => `<div class="dot ${idx===0?'active':''}" onclick="goToSlide('detail-${prod.id}',${idx})"></div>`).join('');
                mediaHTML = `
                    <div style="position:relative;">
                        <div style="overflow:hidden;"><div class="carousel-slides" id="slides-detail-${prod.id}">${slidesHTML}</div></div>
                        ${rawImages.length > 1 ? `<button class="carousel-btn carousel-prev" onclick="slidePrev('detail-${prod.id}')"><i class="fas fa-chevron-left"></i></button><button class="carousel-btn carousel-next" onclick="slideNext('detail-${prod.id}')"><i class="fas fa-chevron-right"></i></button>` : ''}
                    </div>
                    ${rawImages.length > 1 ? `<div class="carousel-dots" id="dots-detail-${prod.id}">${dotsHTML}</div>` : ''}`;
            } else {
                mediaHTML = `<div class="detail-carousel-slide"><div class="placeholder-fill" style="aspect-ratio:auto;height:100%;"><i class="fas ${prod.placeholderIcon || 'fa-image'}" style="font-size:56px;"></i><span>${prod.placeholderText || 'Coming Soon'}</span></div></div>`;
            }

            let detailRightColumnHTML = '';

            if (prod.isCustomApp) {
                // Customized Detail View for Application Services
                detailRightColumnHTML = `
                    <span class="detail-badge">${prod.category || 'Service'}</span>
                    <h2 class="detail-title">${prod.title || 'Untitled'}</h2>
                    <div class="detail-price">Custom Quote <span style="font-size:14px;font-weight:500;color:var(--text-light);">${prod.priceLabel || 'Tailored to your needs'}</span></div>
                    <div class="detail-overview">
                        <strong style="display:block;margin-bottom:6px;color:var(--dark-navy);"><i class="fas fa-info-circle" style="color:var(--primary-blue);margin-right:6px;"></i>Product Overview</strong>
                        ${prod.shortDesc}
                    </div>
                    ${features.length ? `<ul class="detail-features-list">${features.map(f => `<li><i class="fas fa-check-circle"></i><span>${f}</span></li>`).join('')}</ul>` : ''}
                    
                    <div class="enquiry-card">
                        <div class="enquiry-header">
                            <i class="fas fa-paper-plane" style="font-size:18px; width:36px; height:36px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(0,0,0,0.05); color: var(--accent-gold);"></i>
                            <div class="enquiry-header-text">
                                <h3 style="font-size:16px; margin: 0; color: var(--primary-blue);">Request a Custom App</h3>
                                <p style="font-size:12px; margin: 2px 0 0; color: var(--text-light);">We respond within 24 hours.</p>
                            </div>
                        </div>
                        <div class="enquiry-body" id="enquiryBody">
                            <div class="form-row">
                                <div class="form-group"><label>Name *</label><input type="text" id="eq-name" placeholder="e.g. Rajesh Kumar"></div>
                                <div class="form-group"><label>Mobile *</label><input type="tel" id="eq-phone" placeholder="+91 XXXXX XXXXX"></div>
                            </div>
                            <div class="form-row" style="grid-template-columns: 1fr;">
                                <div class="form-group form-full"><label>Email Address</label><input type="email" id="eq-email" placeholder="you@example.com"></div>
                            </div>
                            <div class="form-row" style="grid-template-columns: 1fr;">
                                <div class="form-group form-full"><label>Requirement Details *</label><textarea id="eq-desc" rows="3" placeholder="Briefly describe your business, what the application should do, and any specific features you need..."></textarea></div>
                            </div>
                            <button class="btn-submit" onclick="submitEnquiry()" style="margin-top:16px;"><i class="fas fa-paper-plane"></i> Send Enquiry</button>
                        </div>
                        <div class="form-success" id="formSuccess"><i class="fas fa-check-circle" style="font-size:28px; margin-bottom:12px;"></i><br><strong>Enquiry Sent Successfully!</strong><br><span style="font-size:12px; font-weight:normal;">We will review your requirement and get back within 24 hours.</span></div>
                    </div>
                `;
            } else {
                // Standard Software Product View
                const inCart = !!cart[id];
                const cartBtnHTML = isLive
                    ? `<button id="detail-cart-btn-${id}" class="btn-submit ${inCart ? 'remove' : 'add'}" style="background:${inCart ? 'var(--dark-navy)' : 'var(--accent-gold)'}; color:${inCart ? 'white' : 'var(--dark-navy)'};" onclick="toggleCartState('${id}')"><i class="fas ${inCart ? 'fa-check' : 'fa-cart-plus'}"></i> ${inCart ? 'Remove from Cart' : 'Add to Cart'}</button>`
                    : `<button class="btn-submit" disabled style="background:var(--medium-gray); color:var(--text-light); cursor:not-allowed;">Not Yet Available</button>`;

                detailRightColumnHTML = `
                    <span class="detail-badge">${prod.category || 'Product'}</span>
                    <h2 class="detail-title">${prod.title || 'Untitled'}</h2>
                    <div class="detail-price">${isLive ? `₹${price.toLocaleString('en-IN')}` : 'TBA'} ${isLive && prod.priceLabel ? `<span style="font-size:14px;font-weight:500;color:var(--text-light);">${prod.priceLabel}</span>` : ''}</div>
                    <div class="detail-overview">
                        <strong style="display:block;margin-bottom:6px;color:var(--dark-navy);"><i class="fas fa-info-circle" style="color:var(--primary-blue);margin-right:6px;"></i>Product Overview</strong>
                        ${prod.shortDesc || 'Detailed description coming soon.'}
                    </div>
                    ${features.length ? `<ul class="detail-features-list">${features.map(f => `<li><i class="fas fa-check-circle"></i><span>${f}</span></li>`).join('')}</ul>` : ''}
                    <div class="detail-actions">
                        ${cartBtnHTML}
                    </div>
                `;
            }

            // Integrates Back Button
            const detailHTML = `
                <div class="detail-view-container">
                    <button class="btn-back" onclick="window.location.hash=''">
                        <i class="fas fa-arrow-left"></i> Back to Products
                    </button>
                    <div class="breadcrumb"><a onclick="window.location.hash=''">Products</a> / ${prod.category || 'Product'} / ${prod.title || 'Untitled'}</div>
                    <div class="detail-grid">
                        <div class="detail-media">${mediaHTML}</div>
                        <div>
                            ${detailRightColumnHTML}
                        </div>
                    </div>
                </div>`;

            document.querySelector('.results-toolbar').style.display = 'none';
            document.getElementById('productsListView').style.display = 'none';
            const detailContainer = document.getElementById('productDetailView');
            detailContainer.innerHTML = detailHTML;
            detailContainer.style.display = 'block';

            if (isLive && rawImages.length > 0) {
                slideIndex[`detail-${prod.id}`] = 0;
                slideCount[`detail-${prod.id}`] = rawImages.length;
                updateSlideTransform(`detail-${prod.id}`);
            }
            document.getElementById('products').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateSlideTransform(id) {
            const c = document.getElementById(`slides-${id}`);
            if (!c) return;
            c.style.transform = `translateX(-${(slideIndex[id]||0) * 100}%)`;
            const dots = document.getElementById(`dots-${id}`);
            if (dots) Array.from(dots.children).forEach((d,i) => d.classList.toggle('active', i === slideIndex[id]));
        }
        function slideNext(id) { const max = slideCount[id]||1; slideIndex[id] = (slideIndex[id]+1)%max; updateSlideTransform(id); }
        function slidePrev(id) { const max = slideCount[id]||1; slideIndex[id] = (slideIndex[id]-1+max)%max; updateSlideTransform(id); }
        function goToSlide(id, idx) { slideIndex[id] = idx; updateSlideTransform(id); }

        function toggleCartState(id) {
            const prod = allProductsData.find(p => p.id === id);
            if (!prod) return;
            if (cart[id]) {
                delete cart[id];
                showToast('Removed from cart');
            } else {
                cart[id] = { name: prod.title || 'Product', price: parseFloat(prod.price) || 0, icon: iconFor(prod) };
                showToast('Added to cart');
            }
            updateCartUI();
        }
        
        function removeFromCart(id) { delete cart[id]; updateCartUI(); }
        function clearCart() { cart = {}; updateCartUI(); }

        function openCartDrawer() { 
            if(window.innerWidth <= 992) {
                document.getElementById('cartSidebar').classList.add('open'); 
                document.getElementById('cartBackdrop').classList.add('open'); 
                document.body.style.overflow = 'hidden'; 
            } else {
                document.getElementById('cartSidebar').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        
        function closeCartDrawer() { 
            document.getElementById('cartSidebar').classList.remove('open'); 
            document.getElementById('cartBackdrop').classList.remove('open'); 
            document.body.style.overflow = ''; 
        }

        function updateCartUI() {
            const keys = Object.keys(cart);
            const empty = keys.length === 0;

            // Totals Math
            const subtotal = keys.reduce((s,k) => s + cart[k].price, 0);
            const gst = Math.round(subtotal * 0.18);
            const grand = subtotal + gst;

            // Badges
            const badge = document.getElementById('cartBadge');
            if(badge) {
                badge.textContent = keys.length;
                badge.style.display = keys.length ? 'flex' : 'none';
            }
            const sidebarBadge = document.getElementById('cartCountBadge');
            if(sidebarBadge) sidebarBadge.textContent = keys.length;

            // Toggle visibility of panels
            document.getElementById('cartEmpty').style.display = empty ? 'block' : 'none';
            document.getElementById('cartItems').style.display = empty ? 'none' : 'block';
            document.getElementById('cartTotals').style.display = empty ? 'none' : 'block';
            document.getElementById('cartPayForm').style.display = empty ? 'none' : 'block';
            document.getElementById('cartActions').style.display = empty ? 'none' : 'flex';
            document.getElementById('secureNote').style.display = empty ? 'none' : 'flex';

            // Render Items Explicitly
            const container = document.getElementById('cartItems');
            container.innerHTML = '';
            keys.forEach(id => {
                const it = cart[id];
                const row = document.createElement('div');
                row.className = 'cart-item';
                row.innerHTML = `
                    <div class="cart-item-icon"><i class="fas ${it.icon}"></i></div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${it.name}</div>
                        <div class="cart-item-price">₹${it.price.toLocaleString('en-IN')}</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart('${id}')" aria-label="Remove">
                        <i class="fas fa-trash-alt"></i> Remove
                    </button>`;
                container.appendChild(row);
            });

            // Format Money
            document.getElementById('cartSubtotal').textContent = '₹' + subtotal.toLocaleString('en-IN');
            document.getElementById('cartGst').textContent = '₹' + gst.toLocaleString('en-IN');
            document.getElementById('cartGrand').textContent = '₹' + grand.toLocaleString('en-IN');

            // Force visual re-sync of grids and detail views to show Checkmarks
            renderDynamicProducts(filteredProducts);
            if (window.location.hash.startsWith('#product-')) {
                renderDetailView(window.location.hash.replace('#product-',''));
            }
        }

        async function submitEnquiry() {
            const name = document.getElementById('eq-name').value.trim();
            const phone = document.getElementById('eq-phone').value.trim();
            const email = document.getElementById('eq-email') ? document.getElementById('eq-email').value.trim() : '';
            const desc = document.getElementById('eq-desc').value.trim();
            
            if (!name || !phone || !desc) {
                showCustomAlert('Please fill all required fields (Name, Mobile, Requirement Details).');
                return;
            }
            
            const btn = document.querySelector('.enquiry-body .btn-submit');
            const originalText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            }

            try {
                // Formatting identical to your MessageMe.html endpoint expectations
                const dataObj = {
                    purpose: "Custom Application Enquiry",
                    name: name,
                    mobileNumber: phone,
                    email: email || "Not provided",
                    gender: "N/A", dob: "1900-01-01", tob: "00:00", pob: "N/A", maritalStatus: "N/A", profession: "N/A",
                    expectations: desc,
                    amount: 0, payment_status: "Free Enquiry",
                    submittedAt: new Date().toISOString()
                };

                const res = await fetch(BACKEND_BASE + '/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify(dataObj)
                });

                if (!res.ok) throw new Error("Failed to submit enquiry.");

                document.getElementById('enquiryBody').style.display = 'none';
                document.getElementById('formSuccess').style.display = 'block';
            } catch (err) {
                showCustomAlert(err.message || 'Error submitting enquiry. Please try again.');
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = originalText;
                }
            }
        }

        async function proceedToPayment() {
            const name = document.getElementById('pay-name').value.trim();
            const phone = document.getElementById('pay-phone').value.trim();
            const email = document.getElementById('pay-email').value.trim();
            if (!name || !phone) { showCustomAlert('Please enter your Name and Mobile number'); return; }

            const keys = Object.keys(cart);
            if (keys.length === 0) { showCustomAlert('Cart is empty'); return; }

            const subtotal = keys.reduce((s,k) => s + cart[k].price, 0);
            const grand = subtotal + Math.round(subtotal * 0.18);
            const products = keys.map(k => cart[k].name).join(', ');

            const btn = document.querySelector('.btn-pay-now');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            try {
                document.getElementById('paymentModal').classList.add('visible');

                const dataObj = {
                    purpose: "Product Purchase", name, mobileNumber: phone, email: email || "Not provided",
                    gender: "N/A", dob: "1900-01-01", tob: "00:00", pob: "N/A", maritalStatus: "N/A", profession: "N/A",
                    expectations: "Purchasing Software Products: " + products,
                    amount: grand, payment_status: 'pending', submittedAt: new Date().toISOString()
                };

                try {
                    const sbRes = await fetch(BACKEND_BASE + '/submit-form', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                        body: JSON.stringify(dataObj)
                    });
                    if (!sbRes.ok) console.warn("Supabase response not OK:", await sbRes.text());
                } catch (e) { console.warn("Saving pending cart failed, continuing.", e); }

                const res = await fetch(BACKEND_BASE + '/initiate-razorpay-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
                    body: JSON.stringify({ amount: grand * 100, currency: 'INR', mobileNumber: phone })
                });
                const order = await res.json();
                if (!order.success) throw new Error(order.message || "Payment initiation failed");

                sessionStorage.setItem('rzp_txn_id', order.transactionId);
                sessionStorage.setItem('rzp_order_id', order.razorpayOrderId);
                sessionStorage.setItem('rzp_amt', grand);

                const rzp = new Razorpay({
                    key: RAZORPAY_KEY_ID,
                    amount: order.amount,
                    currency: 'INR',
                    name: 'Ganesh Solutions',
                    description: products.length > 250 ? products.substring(0,250) + '...' : products,
                    order_id: order.razorpayOrderId,
                    handler: (resp) => {
                        window.location.href = `${BACKEND_BASE}/razorpay-return-handler?razorpay_order_id=${resp.razorpay_order_id}&razorpay_payment_id=${resp.razorpay_payment_id}&razorpay_signature=${resp.razorpay_signature}`;
                    },
                    modal: { ondismiss: () => { document.getElementById('paymentModal').classList.remove('visible'); btn.disabled = false; btn.innerHTML = originalText; } },
                    prefill: { name, email, contact: phone },
                    theme: { color: '#1a365d' }
                });
                rzp.open();
            } catch (err) {
                showCustomAlert('Payment Error: ' + err.message);
                document.getElementById('paymentModal').classList.remove('visible');
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const txnId = sessionStorage.getItem('rzp_txn_id');
            const orderId = sessionStorage.getItem('rzp_order_id');
            if (txnId || orderId) {
                document.getElementById('paymentModal').classList.add('visible');
                setTimeout(() => { sessionStorage.clear(); document.getElementById('paymentModal').classList.remove('visible'); }, 5000);
            }
        });

        window.applyFilters = applyFilters;
        window.toggleCartState = toggleCartState;
        window.removeFromCart = removeFromCart;
        window.clearCart = clearCart;
        window.openCartDrawer = openCartDrawer;
        window.closeCartDrawer = closeCartDrawer;
        window.proceedToPayment = proceedToPayment;
        window.submitEnquiry = submitEnquiry;
        window.slideNext = slideNext;
        window.slidePrev = slidePrev;
        window.goToSlide = goToSlide;
    </script>
</body>
</html>
